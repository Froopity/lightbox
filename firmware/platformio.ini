; Lightbox firmware. See ../PLAN.md §1.
[platformio]
default_envs = nano

[avr_base]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = fastled/FastLED@^3.9.0
monitor_speed = 115200
upload_speed = 115200
build_flags = -Wall -Wextra

; Main firmware.
[env:nano]
extends = avr_base
build_src_filter = +<main.cpp>

; Hardware gate demo: cycles Ominous → Alarm every 10 s, rate 0 → 0.5 → 1 (PLAN.md Phase 1).
[env:demo]
extends = avr_base
build_src_filter = +<main.cpp>
build_flags = ${avr_base.build_flags} -DDEMO

; Calibration sketch: shows strip order and direction (PLAN.md Phase 0).
[env:calibrate]
extends = avr_base
build_src_filter = +<calibrate.cpp>

; Layout verification: logical column 0 on every row, plus a dot sweeping row 0.
[env:verify]
extends = avr_base
build_src_filter = +<calibrate.cpp>
build_flags = ${avr_base.build_flags} -DVERIFY_LAYOUT

; Host unit tests for lib/core (Unity).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra -Werror
